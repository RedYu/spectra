<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>CAN WebSocket Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            color: #e5e7eb;
            background: #0b0f14;
            font-family: monospace;
        }

        #log {
            height: 70vh;
            overflow: auto;
            padding: 12px;
            white-space: pre;
            background: #111821;
            border: 1px solid #374151;
        }

        button {
            margin: 0;
            padding: 8px 14px;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 16px;
        }

        .page-header-main {
            min-width: 0;
        }

        .page-title {
            margin: 0 0 16px;
        }

        .connection-toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .connection-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        #status {
            box-sizing: border-box;
            min-width: 150px;
            margin: 0;
            padding: 8px 12px;
            color: #d1d5db;
            background: #111821;
            border: 1px solid #374151;
            border-radius: 6px;
        }

        #status.paused {
            color: #f59e0b;
            border-color: #f59e0b;
        }

        .statistics-panel {
            box-sizing: border-box;
            min-width: 540px;
            padding: 14px 16px;
            background: #111821;
            border: 1px solid #374151;
            border-radius: 10px;
        }

        .statistics-title {
            margin: 0 0 10px;
            color: #f9fafb;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .statistics-grid {
            display: grid;
            grid-template-columns:
                minmax(130px, 1fr) auto
                minmax(130px, 1fr) auto;
            gap: 7px 18px;
            font-size: 13px;
        }

        .statistics-label {
            color: #9ca3af;
        }

        .statistics-value {
            min-width: 44px;
            color: #e5e7eb;
            text-align: right;
        }

        .statistics-value.warning {
            color: #f59e0b;
        }

        .statistics-value.error {
            color: #f05252;
        }

        @media (max-width: 860px) {
            .page-header {
                flex-direction: column;
            }

            .statistics-panel {
                width: 100%;
                min-width: 0;
            }
        }

        @media (max-width: 560px) {
            .connection-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .statistics-grid {
                grid-template-columns:
                    minmax(130px, 1fr) auto;
            }
        }
    </style>
</head>

<body>
    <div class="page-header">
        <div class="page-header-main">
            <h1 class="page-title">
                CAN WebSocket Test
            </h1>

            <div class="connection-toolbar">
                <div id="status">
                    Disconnected
                </div>

                <div class="connection-actions">
                    <button id="connect">
                        Connect
                    </button>

                    <button id="disconnect">
                        Disconnect
                    </button>

                    <button id="clear">
                        Clear
                    </button>
                </div>
            </div>
        </div>

        <section class="statistics-panel">
            <h2 class="statistics-title">
                Stream statistics
            </h2>

            <div class="statistics-grid">
                <span class="statistics-label">Queued events</span>
                <span
                    id="statistics-queued"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Sent events</span>
                <span
                    id="statistics-sent"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Dropped events</span>
                <span
                    id="statistics-dropped"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Send failures</span>
                <span
                    id="statistics-failures"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Queue</span>
                <span
                    id="statistics-queue"
                    class="statistics-value"
                >0 / 64</span>

                <span class="statistics-label">Queue peak</span>
                <span
                    id="statistics-queue-peak"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Sent batches</span>
                <span
                    id="statistics-sent-batches"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Binary payload</span>
                <span
                    id="statistics-binary-bytes"
                    class="statistics-value"
                >0 B</span>

                <span class="statistics-label">Batch events total</span>
                <span
                    id="statistics-batch-events-total"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Batch average</span>
                <span
                    id="statistics-batch-average"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Batch peak</span>
                <span
                    id="statistics-batch-peak"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Received batches</span>
                <span
                    id="statistics-batches"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Received events</span>
                <span
                    id="statistics-events"
                    class="statistics-value"
                >0</span>

                <span class="statistics-label">Filtered events</span>
                <span
                    id="statistics-filtered"
                    class="statistics-value"
                >0</span>
            </div>
        </section>
    </div>

    <div id="log"></div>

    <script>
        const BATCH_HEADER_SIZE = 8;
        const EVENT_HEADER_SIZE = 40;

        let socket = null;
        let lastSequence = null;

        let receivedBatches = 0;
        let receivedEvents = 0;

        const statisticsElements = {
            queued:
                document.getElementById("statistics-queued"),

            sent:
                document.getElementById("statistics-sent"),

            dropped:
                document.getElementById("statistics-dropped"),

            failures:
                document.getElementById("statistics-failures"),

            queue:
                document.getElementById("statistics-queue"),

            queuePeak:
                document.getElementById("statistics-queue-peak"),

            sentBatches:
                document.getElementById(
                    "statistics-sent-batches"
                ),

            binaryBytes:
                document.getElementById(
                    "statistics-binary-bytes"
                ),

            batchEventsTotal:
                document.getElementById(
                    "statistics-batch-events-total"
                ),

            batchAverage:
                document.getElementById(
                    "statistics-batch-average"
                ),

            batchPeak:
                document.getElementById(
                    "statistics-batch-peak"
                ),

            batches:
                document.getElementById("statistics-batches"),

            events:
                document.getElementById("statistics-events"),

            filtered:
                document.getElementById("statistics-filtered"),
        };

        function formatByteSize(value) {
            const bytes =
                Number(value ?? 0);

            if (!Number.isFinite(bytes) ||
                (bytes <= 0)) {

                return "0 B";
            }

            if (bytes < 1024) {
                return `${bytes} B`;
            }

            if (bytes < (1024 * 1024)) {
                return `${(bytes / 1024).toFixed(1)} KB`;
            }

            return (
                `${(bytes / (1024 * 1024)).toFixed(2)} MB`
            );
        }

        function updateStreamStatistics(statistics) {
            statisticsElements.queued.textContent =
                statistics.queued_events ?? 0;

            statisticsElements.sent.textContent =
                statistics.sent_events ?? 0;

            statisticsElements.dropped.textContent =
                statistics.dropped_events ?? 0;

            statisticsElements.failures.textContent =
                statistics.send_failures ?? 0;

            statisticsElements.queue.textContent =
                `${statistics.queue_current ?? 0} / ` +
                `${statistics.queue_capacity ?? 0}`;

            statisticsElements.queuePeak.textContent =
                statistics.queue_peak ?? 0;

            statisticsElements.sentBatches.textContent =
                statistics.sent_batches ?? 0;

            statisticsElements.binaryBytes.textContent =
                formatByteSize(
                    statistics.sent_binary_bytes
                );

            statisticsElements.batchEventsTotal.textContent =
                statistics.batch_events_total ?? 0;

            statisticsElements.batchAverage.textContent =
                statistics.batch_events_average ?? 0;

            statisticsElements.batchPeak.textContent =
                statistics.batch_events_peak ?? 0;

            statisticsElements.dropped.classList.toggle(
                "warning",
                Number(statistics.dropped_events) > 0
            );

            statisticsElements.failures.classList.toggle(
                "error",
                Number(statistics.send_failures) > 0
            );

            statisticsElements.filtered.textContent =
                statistics.filtered_events ?? 0;

            const batchAverage =
                Number(
                    statistics.batch_events_average ?? 0
                );

            statisticsElements.batchAverage.classList.toggle(
                "warning",
                (batchAverage > 0) &&
                (batchAverage < 32)
            );
        }

        const status =
            document.getElementById("status");

        const log =
            document.getElementById("log");

        const LOG_LINE_LIMIT = 1000;
        const LOG_FLUSH_INTERVAL_MS = 50;

        const logLines = [];
        const pendingLogLines = [];

        let logFlushTimer = null;

        function flushLog() {
            logFlushTimer = null;

            if (pendingLogLines.length === 0) {
                return;
            }

            for (const line of pendingLogLines) {
                logLines.push(
                    line
                );
            }

            pendingLogLines.length = 0;

            if (logLines.length >
                LOG_LINE_LIMIT) {

                logLines.splice(
                    0,
                    logLines.length -
                        LOG_LINE_LIMIT
                );
            }

            log.textContent =
                `${logLines.join("\n")}\n`;

            log.scrollTop =
                log.scrollHeight;

            statisticsElements.batches.textContent =
                receivedBatches;

            statisticsElements.events.textContent =
                receivedEvents;
        }

        function appendLogBatch(messages) {
            if ((messages === null) ||
                (messages.length === 0)) {

                return;
            }

            for (const message of messages) {
                pendingLogLines.push(
                    message
                );
            }

            if (logFlushTimer === null) {
                logFlushTimer =
                    setTimeout(
                        flushLog,
                        LOG_FLUSH_INTERVAL_MS
                    );
            }
        }

        function appendLog(message) {
            appendLogBatch(
                [message]
            );
        }

        function eventName(value) {
            return [
                "RX",
                "TX_QUEUED",
                "TX_COMPLETED",
                "TX_FAILED",
                "TX_ABORTED"
            ][value] ?? `UNKNOWN(${value})`;
        }

        function busName(value) {
            return value === 0
                ? "Primary"
                : value === 1
                    ? "Secondary"
                    : `Bus(${value})`;
        }

        function timestampSourceName(value) {
            return [
                "none",
                "software",
                "hardware"
            ][value] ?? `unknown(${value})`;
        }

        function hex(value, width) {
            return value
                .toString(16)
                .toUpperCase()
                .padStart(width, "0");
        }

        function parseEvent(
            view,
            offset,
            lines
        ) {
            if ((offset + EVENT_HEADER_SIZE) >
                view.byteLength) {

                throw new Error("Truncated event header");
            }

            const type =
                view.getUint8(offset + 0);

            const bus =
                view.getUint8(offset + 1);

            const direction =
                view.getUint8(offset + 2);

            const flags =
                view.getUint8(offset + 3);

            const dlc =
                view.getUint8(offset + 4);

            const dataLength =
                view.getUint8(offset + 5);

            const timestampSource =
                view.getUint8(offset + 6);

            const eventSequence =
                view.getUint32(
                    offset + 8,
                    true
                );

            const transactionId =
                view.getUint32(
                    offset + 12,
                    true
                );

            const nativeSequence =
                view.getUint32(
                    offset + 16,
                    true
                );

            const identifier =
                view.getUint32(
                    offset + 20,
                    true
                );

            const result =
                view.getInt32(
                    offset + 24,
                    true
                );

            const timestampUs =
                view.getBigUint64(
                    offset + 28,
                    true
                );

            if (dataLength > 64) {
                throw new Error(
                    `Invalid payload length ${dataLength}`
                );
            }

            const eventSize =
                EVENT_HEADER_SIZE +
                dataLength;

            if ((offset + eventSize) >
                view.byteLength) {

                throw new Error("Truncated event payload");
            }

            const data =
                new Uint8Array(
                    view.buffer,
                    view.byteOffset +
                        offset +
                        EVENT_HEADER_SIZE,
                    dataLength
                );

            const dataText =
                Array.from(data)
                    .map(byte => hex(byte, 2))
                    .join(" ");

            if (lastSequence !== null) {
                const expected =
                    (lastSequence + 1) >>> 0;

                if (eventSequence !== expected) {
                    lines.push(
                        `WARNING: sequence gap, expected ` +
                        `${expected}, received ${eventSequence}`
                    );
                }
            }

            lastSequence =
                eventSequence;

            const extended =
                (flags & (1 << 0)) !== 0;

            const remote =
                (flags & (1 << 1)) !== 0;

            const fd =
                (flags & (1 << 2)) !== 0;

            const brs =
                (flags & (1 << 3)) !== 0;

            const esi =
                (flags & (1 << 4)) !== 0;

            lines.push(
                `${eventSequence} ` +
                `${eventName(type)} ` +
                `${busName(bus)} ` +
                `${direction === 0 ? "RX" : "TX"} ` +
                `ID=${hex(identifier, extended ? 8 : 3)} ` +
                `DLC=${dlc} LEN=${dataLength} ` +
                `FD=${fd} BRS=${brs} RTR=${remote} ESI=${esi} ` +
                `TXID=${transactionId} NATIVE=${nativeSequence} ` +
                `RESULT=${result} ` +
                `TS=${timestampUs}(${timestampSourceName(timestampSource)}) ` +
                `[${dataText}]`
            );

            return eventSize;
        }

        function parseBatch(buffer) {
            const batchLines = [];

            const view =
                new DataView(buffer);

            if (view.byteLength <
                BATCH_HEADER_SIZE) {

                throw new Error("Truncated batch header");
            }

            const version =
                view.getUint8(0);

            const messageType =
                view.getUint8(1);

            const eventCount =
                view.getUint16(
                    2,
                    true
                );

            const payloadSize =
                view.getUint32(
                    4,
                    true
                );

            if (version !== 1) {
                throw new Error(
                    `Unsupported protocol version ${version}`
                );
            }

            if (messageType !== 1) {
                throw new Error(
                    `Unsupported binary message type ${messageType}`
                );
            }

            if ((BATCH_HEADER_SIZE + payloadSize) !==
                view.byteLength) {

                throw new Error(
                    "Batch payload size mismatch"
                );
            }

            let offset =
                BATCH_HEADER_SIZE;

            for (let index = 0;
                 index < eventCount;
                 ++index) {

                offset +=
                    parseEvent(
                        view,
                        offset,
                        batchLines
                    );
            }

            if (offset !== view.byteLength) {
                throw new Error(
                    "Unexpected trailing batch data"
                );
            }

            appendLogBatch(
                batchLines
            );

            receivedBatches += 1;
            receivedEvents += eventCount;

        }

        function connect() {
            if (socket !== null) {
                return;
            }

            status.textContent = "Connecting";
            status.classList.remove("paused");

            const scheme =
                location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            socket =
                new WebSocket(
                    `${scheme}//${location.host}/ws/can`
                );

            socket.binaryType =
                "arraybuffer";

            socket.onopen =
                () => {
                    status.textContent =
                        "Connected";

                    status.classList.remove("paused");

                    appendLog(
                        "WebSocket connected"
                    );

                    /*
                     * Activate server-side CAN streaming and verify the
                     * bidirectional WebSocket connection.
                     */
                    socket.send(
                        JSON.stringify({
                            command: "subscribe",
                            primary: true,
                            secondary: true,
                            rx: true,
                            tx: true,
                            paused: false
                        })
                    );
                };

            socket.onmessage =
                event => {
                    try {
                        if (typeof event.data === "string") {
                            const message =
                                JSON.parse(
                                    event.data
                                );

                            if (message.type ===
                                "stream_statistics") {

                                updateStreamStatistics(
                                    message
                                );

                            } else if (message.type ===
                                       "subscription") {

                                status.textContent =
                                    message.paused
                                        ? "Paused"
                                        : "Connected";

                                status.classList.toggle(
                                    "paused",
                                    message.paused
                                );

                                appendLog(
                                    `Subscription updated: ${event.data}`
                                );

                            } else {
                                appendLog(
                                    `JSON: ${event.data}`
                                );
                            }

                            return;
                        }

                        parseBatch(
                            event.data
                        );

                    } catch (error) {
                        appendLog(
                            `PARSE ERROR: ${error.message}`
                        );
                    }
                };

            socket.onerror =
                () => {
                    status.textContent = "Error";
                    status.classList.remove("paused");

                    appendLog(
                        "WebSocket error"
                    );
                };

            socket.onclose =
                event => {
                    status.textContent =
                        `Disconnected (${event.code})`;

                    status.classList.remove("paused");

                    appendLog(
                        `WebSocket closed: ${event.code}`
                    );

                    socket = null;
                    lastSequence = null;
                };
        }

        function disconnect() {
            if (socket !== null) {
                socket.close(
                    1000,
                    "Test completed"
                );
            }
        }

        document
            .getElementById("connect")
            .addEventListener(
                "click",
                connect
            );

        document
            .getElementById("disconnect")
            .addEventListener(
                "click",
                disconnect
            );

        document
            .getElementById("clear")
            .addEventListener(
                "click",
                () => {
                    if (logFlushTimer !== null) {
                        clearTimeout(
                            logFlushTimer
                        );

                        logFlushTimer = null;
                    }

                    pendingLogLines.length = 0;
                    logLines.length = 0;
                    log.textContent = "";

                    lastSequence = null;
                    receivedBatches = 0;
                    receivedEvents = 0;

                    statisticsElements.batches.textContent =
                        "0";

                    statisticsElements.events.textContent =
                        "0";
                }
            );
    </script>
</body>
</html>
