<!DOCTYPE html>
<html lang="en" class="page-files">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="shortcut icon"
        href="/favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="icon"
        href="/favicon.ico"
        type="image/x-icon"
    >

    <title>Spectra Files</title>

    <link rel="stylesheet" href="spectra.css?v=31">
    <script src="spectra.js?v=31" defer></script>
</head>

<body class="page-files">
    <header class="spectra-header">
        <a
            class="spectra-brand"
            href="/"
        >
            <span aria-hidden="true">▧</span>
            <span
                id="device-title"
                class="brand-title"
            >
                Spectra
            </span>
        </a>

        <nav
            class="spectra-nav"
            aria-label="Main navigation"
        >
            <a href="/">Overview</a>
            <a href="/can_logger">CAN Logger</a>
            <a href="/can_analyzer">CAN Analyzer</a>
            <a href="/files" aria-current="page">Files</a>
            <a href="/settings">Settings</a>
            <a href="/diagnostics">Diagnostics</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-header">
            <div>
                <h1>File manager</h1>

                <p>
                    Browse and download files from Spectra storage
                </p>
            </div>

            <div class="volume-control">
                <label for="volume">
                    Storage volume
                </label>

                <select
                    id="volume"
                    class="volume-select"
                    aria-label="Storage volume"
                >
                    <option value="internal">
                        Internal storage
                    </option>

                    <option value="sd" selected>
                        SD card
                    </option>
                </select>
            </div>
        </section>

        <div class="files-browser">
            <aside
                class="directory-panel"
                aria-label="Storage folders"
            >
                <div class="directory-panel-header">
                    <h2>Folders</h2>

                    <button
                        id="refresh-tree"
                        class="directory-refresh"
                        type="button"
                        title="Refresh folder tree"
                        aria-label="Refresh folder tree"
                    >
                        ↻
                    </button>
                </div>

                <div
                    id="directory-tree"
                    class="directory-tree"
                    role="tree"
                ></div>
            </aside>

            <section class="card file-panel">
            <div class="file-actions" aria-label="File operations">
                <button id="create-folder" class="button button-secondary" type="button">New folder</button>
                <button id="create-file" class="button button-secondary" type="button">New file</button>
                <label for="upload-files" class="button button-primary">Upload files</label>
                <input id="upload-files" type="file" multiple hidden>
                <span id="upload-progress" class="file-operation-progress"></span>
                <button id="format-sd" class="button button-danger file-format-button" type="button">Format SD</button>
            </div>
            <nav
                class="file-toolbar"
                aria-label="Directory navigation"
            >
                <button
                    id="back"
                    class="button button-secondary"
                    type="button"
                    disabled
                >
                    Back
                </button>

                <div class="path-container">
                    <span class="path-label">
                        Path
                    </span>

                    <span
                        id="current-path"
                        class="path"
                        title="/"
                    >
                        /
                    </span>
                </div>
            </nav>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="file-list"></tbody>
                </table>
            </div>

            <nav
                class="pagination"
                aria-label="File-list pages"
            >
                <button
                    id="previous-page"
                    class="button button-secondary"
                    type="button"
                    disabled
                >
                    Previous
                </button>

                <span
                    id="page-status"
                    class="page-status"
                >
                    No entries
                </span>

                <button
                    id="next-page"
                    class="button button-primary"
                    type="button"
                    disabled
                >
                    Next
                </button>
            </nav>
            </section>
        </div>

        <p
            id="status"
            class="status"
            role="status"
            aria-live="polite"
        ></p>

        <dialog id="file-viewer" class="file-viewer-dialog">
            <div class="file-viewer-header">
                <div>
                    <h2 id="file-viewer-title">File preview</h2>
                    <span id="file-viewer-meta"></span>
                </div>
                <button id="file-viewer-close" class="button button-secondary" type="button">Close</button>
            </div>
            <pre id="file-viewer-content"></pre>
        </dialog>
    </main>

</body>
</html>
