name: ESP-IDF Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

env:
  ESP_IDF_VFS_FIX: 4a5d1af3de15fa291169652a9e8068f660715000

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"

      - name: Apply ESP-IDF VFS fix
        shell: bash
        run: |
          git -C "$IDF_PATH" fetch \
            --no-recurse-submodules \
            origin \
            "$ESP_IDF_VFS_FIX"

          git -C "$IDF_PATH" cherry-pick \
            --no-commit \
            "$ESP_IDF_VFS_FIX"

          git -C "$IDF_PATH" diff --check
          git -C "$IDF_PATH" diff --stat

      - name: Show ESP-IDF version
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          git -C "$IDF_PATH" status --short

      - name: Show firmware version
        shell: bash
        run: |
          git describe --tags --always --dirty

      - name: Build project
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spectra-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          if-no-files-found: error